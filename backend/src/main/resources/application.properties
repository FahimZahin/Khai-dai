
spring.application.name=khaidai-backend

# Server
server.port=8090

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/khaidai_db
spring.datasource.username=${DB_USERNAME:postgres}
#spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JSON
spring.jackson.serialization.indent-output=true
#postgrePassword=1234


# Admin security
khaidai.admin.api-key=${KHAIDAI_ADMIN_API_KEY:}

# Database
spring.datasource.password=${DB_PASSWORD:}

# SSLCommerz Sandbox
sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:}
sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:}
sslcommerz.base-url=${SSLCOMMERZ_BASE_URL:https://sandbox.sslcommerz.com}
sslcommerz.callback-base-url=${KHAIDAI_PUBLIC_BACKEND_URL:http://localhost:8090}

sslcommerz.frontend-base-url=${KHAIDAI_FRONTEND_URL:http://localhost:5173}
